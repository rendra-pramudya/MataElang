[project]
name = "mataelang"
version = "0.1.0"
description = "MataElang — single-user, self-hosted world monitor (Phase 0 spine)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "apscheduler>=3.10,<4",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Phase 1 heat map only. Hex binning keeps density comparable across latitudes; square
    # degree-bins make Norway look like a war zone. GeoPandas/Shapely stay in Phase 2.
    "h3>=4.1",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mataelang"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["mataelang/models.py", "mataelang/bus.py", "mataelang/analysis/heat.py"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# h3 ships no py.typed marker. Its two call sites in heat.py are covered by tests instead.
module = ["h3.*"]
ignore_missing_imports = true
